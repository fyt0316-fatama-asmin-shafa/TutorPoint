<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Find Tutor - TutorPoint</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, Arial, sans-serif;
            background: linear-gradient(145deg, #fef2f8 0%, #fce7f2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            background: white;
            padding: 8px 20px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 600;
            color: #c13584;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(193, 53, 132, 0.1);
            font-size: 14px;
        }

        .back-home i {
            font-size: 14px;
        }

        .back-home:hover {
            background: #c13584;
            color: white;
            transform: translateX(-3px);
            box-shadow: 0 8px 18px rgba(193, 53, 132, 0.2);
        }

        .search-container {
            background: rgba(255, 255, 255, 0.98);
            padding: 12px 20px;
            border-radius: 60px;
            display: flex;
            gap: 12px;
            max-width: 700px;
            margin: 0 auto 25px;
            box-shadow: 0 12px 28px rgba(193, 53, 132, 0.12);
            border: 1px solid rgba(240, 192, 213, 0.6);
            backdrop-filter: blur(2px);
        }

        .search-container input {
            flex: 1;
            padding: 14px 18px;
            border: none;
            border-radius: 60px;
            font-size: 15px;
            outline: none;
            background: #fff5f9;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .search-container input:focus {
            background: white;
            box-shadow: 0 0 0 3px rgba(193, 53, 132, 0.2);
        }

        .search-container input::placeholder {
            color: #b85c8a;
            opacity: 0.7;
            font-weight: 400;
        }

        .search-container button {
            background: linear-gradient(105deg, #ff5ca8, #c13584);
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 60px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.25s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
        }

        .search-container button:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 18px rgba(193, 53, 132, 0.35);
        }

        .filter-info {
            background: white;
            border-radius: 50px;
            padding: 12px 25px;
            max-width: 700px;
            margin: 0 auto 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            box-shadow: 0 4px 12px rgba(193, 53, 132, 0.08);
            border: 1px solid #fad1e4;
        }

        .filter-info span:first-child {
            color: #9e2a6e;
            font-weight: 600;
            font-size: 15px;
        }

        .filter-info .subject-name {
            background: linear-gradient(135deg, #ff5ca8, #c13584);
            color: white;
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .clear-filter {
            background: #f3eef1;
            border: none;
            padding: 6px 16px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 500;
            color: #8e3b65;
            transition: 0.2s;
            font-size: 13px;
        }

        .clear-filter:hover {
            background: #c13584;
            color: white;
        }

        .tutor-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 26px;
            max-width: 1300px;
            margin: 0 auto;
        }

        .tutor-card {
            background: white;
            border-radius: 32px;
            padding: 24px 18px 22px;
            text-align: center;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.05);
            transition: all 0.25s ease;
            border: 1px solid rgba(255, 205, 226, 0.6);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            backdrop-filter: blur(2px);
        }

        .tutor-card:hover {
            transform: translateY(-8px);
            border-color: #ff8abf;
            box-shadow: 0 24px 40px rgba(193, 53, 132, 0.2);
        }

        .tutor-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 14px;
            border: 4px solid #ffe2f0;
            box-shadow: 0 10px 18px rgba(0, 0, 0, 0.08);
        }

        .tutor-card h3 {
            color: #831d59;
            margin: 8px 0 6px;
            font-size: 1.35rem;
            font-weight: 700;
            text-transform: capitalize;
            line-height: 1.3;
            max-width: 100%;
            word-break: break-word;
        }

        .tutor-rating {
            color: #ffb347;
            margin: 6px 0;
            font-size: 15px;
            letter-spacing: 1px;
        }

        .tutor-rating span {
            color: #6c4a5c;
            font-size: 12px;
            margin-left: 5px;
            font-weight: 500;
        }

        .tutor-card p {
            font-size: 13.5px;
            color: #4a2e3f;
            margin: 6px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            font-weight: 500;
        }

        .tutor-card i {
            color: #c13584;
            font-size: 14px;
            width: 20px;
        }

        .tutor-badge {
            background: linear-gradient(115deg, #ff7eb3, #c13584);
            color: white;
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 700;
            margin: 5px 0 4px;
            display: inline-block;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }

        .button-group {
            display: flex;
            gap: 12px;
            width: 100%;
            margin-top: 18px;
        }

        .view-profile-btn,
        .contact-teacher-btn {
            flex: 1;
            padding: 10px 5px;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .view-profile-btn {
            background: linear-gradient(115deg, #7a6ae5, #a363d9);
            color: white;
            box-shadow: 0 4px 8px rgba(108, 92, 231, 0.2);
        }

        .contact-teacher-btn {
            background: linear-gradient(115deg, #ff6da9, #c13584);
            color: white;
            box-shadow: 0 4px 8px rgba(193, 53, 132, 0.25);
        }

        .view-profile-btn:hover,
        .contact-teacher-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.02);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.15);
        }

        /* Modal styles */
        .tutor-details-modal,
        .contact-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10001;
        }

        .tutor-details-box,
        .contact-modal-box {
            background: white;
            width: 90%;
            max-width: 620px;
            border-radius: 40px;
            padding: 28px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.3);
            animation: fadeSlideUp 0.3s;
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .tutor-details-header {
            display: flex;
            align-items: center;
            gap: 24px;
            flex-wrap: wrap;
            margin-bottom: 22px;
            border-bottom: 2px solid #fce0ed;
            padding-bottom: 18px;
        }

        .tutor-details-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #c13584;
        }

        .tutor-details-info h3 {
            color: #831d59;
            font-size: 26px;
            font-weight: 800;
            word-break: break-word;
        }

        .tutor-details-info p {
            font-size: 14px;
            color: #5e3b4e;
            margin: 5px 0;
        }

        .tutor-details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 14px;
            margin: 18px 0;
        }

        .tutor-details-item {
            background: #fdf3f8;
            padding: 12px 14px;
            border-radius: 22px;
        }

        .tutor-details-item strong {
            color: #c13584;
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .close-details-btn,
        .close-modal {
            background: linear-gradient(115deg, #c13584, #a3296b);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 40px;
            font-weight: bold;
            margin-top: 18px;
            cursor: pointer;
        }

        .tutor-info-badge {
            background: #fcf0f6;
            border-radius: 28px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .tutor-info-badge img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid #c13584;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            font-weight: 600;
            color: #222;
            margin-bottom: 6px;
            display: block;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #f0c0d5;
            border-radius: 28px;
            font-size: 14px;
            background: #fffafd;
        }

        .submit-request-btn {
            background: linear-gradient(135deg, #ff5ca8, #c13584);
            border: none;
            padding: 14px;
            border-radius: 40px;
            font-weight: bold;
            width: 100%;
            color: white;
            cursor: pointer;
            margin-top: 6px;
        }

        .login-prompt,
        .self-warning {
            text-align: center;
            padding: 22px;
            border-radius: 28px;
            margin: 12px 0;
        }

        .login-prompt {
            background: #faecf3;
        }

        .self-warning {
            background: #ffe6e9;
            color: #c13584;
        }

        .info-note {
            background: #e8f0fe;
            padding: 12px;
            border-radius: 30px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
        }

        #statusMsg {
            text-align: center;
            font-size: 18px;
            background: white;
            padding: 20px;
            border-radius: 50px;
            color: #c13584;
        }
    </style>
</head>

<body>

    <a href="home.html" class="back-home"><i class="fas fa-arrow-left"></i> Back to Home</a>

    <div id="filterInfo" class="filter-info" style="display: none;">
        <span>🔍 Showing tutors for:</span>
        <span class="subject-name" id="currentSubject"></span>
        <button class="clear-filter" onclick="clearSubjectFilter()">✕ Clear Filter</button>
    </div>

    <div class="search-container">
        <input type="text" id="searchInput"
            placeholder="🔍 Search by Subject or Area (e.g. Math, Physics, Dhaka, Mirpur)" onkeyup="filterTutors()">
        <button onclick="filterTutors()"><i class="fas fa-search"></i> Search</button>
    </div>

    <div id="tutorList" class="tutor-grid">
        <p id="statusMsg">Loading Tutors...</p>
    </div>

    <!-- Tutor Details Modal -->
    <div class="tutor-details-modal" id="tutorDetailsModal">
        <div class="tutor-details-box">
            <div id="tutorDetailsContent"></div>
            <button class="close-details-btn" onclick="closeTutorDetails()">Close</button>
        </div>
    </div>

    <!-- Contact Teacher Modal -->
    <div class="contact-modal" id="contactModal">
        <div class="contact-modal-box">
            <div class="contact-modal-header"
                style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="color:#8e164d;"><i class="fas fa-envelope"></i> Contact Teacher</h3>
                <button class="close-modal" onclick="closeContactModal()"
                    style="background: none; border: none; font-size: 26px; cursor:pointer;">&times;</button>
            </div>
            <div id="contactTutorInfo" class="tutor-info-badge"></div>
            <div id="loginPrompt" class="login-prompt" style="display: none;">
                <p><i class="fas fa-exclamation-triangle"></i> Please login to contact teacher</p>
                <a href="login.html"
                    style="background: #c13584; color:white; padding:8px 22px; border-radius: 40px; text-decoration: none; display:inline-block;"><i
                        class="fas fa-sign-in-alt"></i> Login Now</a>
            </div>
            <div id="selfWarning" class="self-warning" style="display: none;">
                <i class="fas fa-user-slash"></i> You cannot send a contact request to yourself.
            </div>
            <form id="contactForm" style="display: none;">
                <div class="info-note">
                    <i class="fas fa-info-circle"></i> Fill out the form below. Admin will contact you soon.
                </div>
                <div class="form-group">
                    <label><i class="fas fa-user-graduate"></i> Student Name *</label>
                    <input type="text" id="studentName" placeholder="e.g. Rahim Ahmed" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-map-marker-alt"></i> Area/Location *</label>
                    <input type="text" id="area" placeholder="e.g. Mirpur, Dhaka" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-phone-alt"></i> Phone Number *</label>
                    <input type="tel" id="contactPhone" placeholder="017XXXXXXXX" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-sticky-note"></i> Details (Class, Subjects, Requirements) *</label>
                    <textarea id="details"
                        placeholder="Example: Class 8 student, needs help with Math and Physics. Looking for 3 days per week."
                        required></textarea>
                </div>
                <button type="submit" class="submit-request-btn"><i class="fas fa-paper-plane"></i> Submit
                    Request</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy, doc, getDoc, addDoc, serverTimestamp, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAkUHxzVA6SxcTeheoytoWUAiuTKADWBQw",
            authDomain: "medialert-a04d5.firebaseapp.com",
            projectId: "medialert-a04d5",
            storageBucket: "medialert-a04d5.firebasestorage.app",
            messagingSenderId: "267657249954",
            appId: "1:267657249954:web:01165929839cb83e7e03fb"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allTutors = [];
        let allTutorDocs = [];
        let currentSubject = null;
        let selectedTutor = null;
        let currentTutorId = null;

        const isLoggedIn = localStorage.getItem("userLoggedIn") === "true";
        const userType = localStorage.getItem("userType");
        const userDocId = localStorage.getItem("userDocId");
        const userName = localStorage.getItem("userName");
        const userEmail = localStorage.getItem("userEmail");

        async function fetchCurrentTutorId() {
            if (userType !== 'tutor' || !userEmail) return null;
            if (currentTutorId) return currentTutorId;
            try {
                const q = query(collection(db, "tutors"), where("email", "==", userEmail));
                const snapshot = await getDocs(q);
                if (!snapshot.empty) {
                    currentTutorId = snapshot.docs[0].id;
                    return currentTutorId;
                }
            } catch (err) {
                console.error("Error fetching tutor id:", err);
            }
            return null;
        }

        function getStarRating(rating) {
            const fullStars = Math.floor(rating);
            const hasHalfStar = rating % 1 >= 0.5;
            let starsHtml = '';
            for (let i = 1; i <= 5; i++) {
                if (i <= fullStars) starsHtml += '<i class="fas fa-star"></i>';
                else if (i === fullStars + 1 && hasHalfStar) starsHtml += '<i class="fas fa-star-half-alt"></i>';
                else starsHtml += '<i class="far fa-star"></i>';
            }
            return starsHtml;
        }

        function getSubjectFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('subject');
        }

        async function loadTutors() {
            try {
                const q = query(collection(db, "tutors"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                allTutors = [];
                allTutorDocs = [];
                querySnapshot.forEach((doc) => {
                    allTutors.push(doc.data());
                    allTutorDocs.push({ id: doc.id, data: doc.data() });
                });

                const subjectFromUrl = getSubjectFromUrl();
                if (subjectFromUrl) {
                    const decodedSubject = decodeURIComponent(subjectFromUrl).toLowerCase().trim();
                    currentSubject = decodedSubject;
                    document.getElementById('filterInfo').style.display = 'flex';
                    document.getElementById('currentSubject').textContent = subjectFromUrl;
                    filterTutorsBySubject(decodedSubject);
                } else {
                    document.getElementById('filterInfo').style.display = 'none';
                    displayTutors(allTutors);
                }

                if (userType === 'tutor') await fetchCurrentTutorId();
            } catch (error) {
                console.error("Error loading tutors: ", error);
                document.getElementById("statusMsg").innerText = "❌ Error loading data! Please refresh.";
            }
        }

        function filterTutorsBySubject(subject) {
            const filtered = allTutors.filter(tutor => {
                if (!tutor.subject) return false;
                const tutorSubjects = tutor.subject.toLowerCase().split(',').map(s => s.trim());
                return tutorSubjects.some(s => s.includes(subject) || subject.includes(s));
            });
            displayTutors(filtered);
            if (filtered.length === 0) {
                document.getElementById("statusMsg").innerText = `📭 "${document.getElementById('currentSubject').textContent}" বিষয়ের কোনো টিউটর পাওয়া যায়নি!`;
            }
        }

        window.clearSubjectFilter = function () {
            currentSubject = null;
            document.getElementById('filterInfo').style.display = 'none';
            const url = new URL(window.location);
            url.searchParams.delete('subject');
            window.history.pushState({}, '', url);
            displayTutors(allTutors);
            document.getElementById("searchInput").value = '';
        };

        // ========== SHOW FULL NAME — NO TRUNCATION ==========
        function displayTutors(tutorArray) {
            const container = document.getElementById("tutorList");
            container.innerHTML = "";
            if (!tutorArray.length) {
                container.innerHTML = `<p id="statusMsg">📌 কোনো টিউটর পাওয়া যায়নি | No tutors found</p>`;
                return;
            }
            tutorArray.forEach((tutor) => {
                const tutorDoc = allTutorDocs.find(doc => doc.data.email === tutor.email);
                const tutorId = tutorDoc ? tutorDoc.id : '';
                const profileImg = tutor.profilePic || "https://cdn-icons-png.flaticon.com/512/3135/3135715.png";
                const ratingNum = tutor.averageRating || 4.5;
                const reviewCount = tutor.reviewCount || Math.floor(Math.random() * 20) + 5;

                // ✅ FULL NAME — no space splitting, show as stored
                const fullName = tutor.name && tutor.name.trim() !== "" ? tutor.name.trim() : "Professional Tutor";

                let subjects = tutor.subject || 'N/A';
                if (subjects.includes(',')) subjects = subjects.split(',')[0].trim();
                let area = tutor.area || 'N/A';
                if (area.includes(',')) area = area.split(',')[0].trim();
                let qualification = tutor.qualification || 'N/A';
                if (qualification.includes(',')) qualification = qualification.split(',')[0].trim();

                const card = document.createElement("div");
                card.className = "tutor-card";
                card.onclick = () => showTutorDetails(tutorId);
                // Pass FULL name to contact modal as well
                card.innerHTML = `
                <img src="${profileImg}" class="tutor-img" alt="profile">
                <div class="tutor-badge">⭐ ${ratingNum.toFixed(1)}</div>
                <h3>${escapeHtml(fullName)}</h3>
                <div class="tutor-rating">${getStarRating(ratingNum)}<span>(${reviewCount})</span></div>
                <p><i class="fas fa-book"></i> ${subjects}</p>
                <p><i class="fas fa-map-marker-alt"></i> ${area}</p>
                <p><i class="fas fa-graduation-cap"></i> ${qualification}</p>
                <div class="button-group">
                    <button class="view-profile-btn" onclick="event.stopPropagation(); showTutorDetails('${tutorId}')"><i class="fas fa-user-graduate"></i> Profile</button>
                    <button class="contact-teacher-btn" onclick="event.stopPropagation(); openContactModal('${tutorId}', '${escapeHtml(fullName).replace(/'/g, "\\'")}', '${profileImg}')"><i class="fas fa-envelope"></i> Contact</button>
                </div>
            `;
                container.appendChild(card);
            });
        }

        // helper to avoid XSS but keep names readable
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function (m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function (c) {
                return c;
            });
        }

        window.showTutorDetails = async function (tutorId) {
            if (!tutorId) return;
            try {
                const tutorRef = doc(db, "tutors", tutorId);
                const tutorDoc = await getDoc(tutorRef);
                if (tutorDoc.exists()) {
                    const tutor = tutorDoc.data();
                    const ratingNum = tutor.averageRating || 4.5;
                    const reviewCount = tutor.reviewCount || Math.floor(Math.random() * 20) + 5;
                    const fullNameDetails = tutor.name || 'N/A';
                    document.getElementById("tutorDetailsContent").innerHTML = `
                    <div class="tutor-details-header">
                        <img src="${tutor.profilePic || 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png'}" class="tutor-details-img">
                        <div class="tutor-details-info">
                            <h3>${escapeHtml(fullNameDetails)}</h3>
                            <p><i class="fas fa-star" style="color:#ffc107"></i> ${ratingNum.toFixed(1)} (${reviewCount} reviews)</p>
                            <p><i class="fas fa-id-card"></i> ID: TS-${tutorId.slice(-5)}</p>
                            <p><i class="fas fa-venus-mars"></i> ${tutor.gender || 'Not specified'}</p>
                        </div>
                    </div>
                    <div class="tutor-details-grid">
                        <div class="tutor-details-item"><strong>📚 Qualification</strong><p>${tutor.qualification || 'N/A'}</p></div>
                        <div class="tutor-details-item"><strong>📍 Location</strong><p>${tutor.area || 'N/A'}</p></div>
                        <div class="tutor-details-item"><strong>💰 Salary</strong><p>${tutor.salary || 'Negotiable'} TK</p></div>
                        <div class="tutor-details-item"><strong>💼 Experience</strong><p>${tutor.experience || '0'} years</p></div>
                        <div class="tutor-details-item"><strong>📖 Subjects</strong><p>${tutor.subject || 'N/A'}</p></div>
                        <div class="tutor-details-item"><strong>⏰ Time</strong><p>${tutor.preferredTime || 'Flexible'}</p></div>
                        <div class="tutor-details-item"><strong>✉️ Email</strong><p>${tutor.email || 'N/A'}</p></div>
                    </div>
                    <div class="tutor-details-item"><strong>📝 About</strong><p>${tutor.about || 'Experienced tutor dedicated to student success.'}</p></div>
                `;
                    document.getElementById("tutorDetailsModal").style.display = "flex";
                }
            } catch (error) {
                console.error("details error", error);
            }
        };

        window.closeTutorDetails = () => document.getElementById("tutorDetailsModal").style.display = "none";

        window.filterTutors = function () {
            const searchTerm = document.getElementById("searchInput").value.toLowerCase().trim();
            let baseArray = currentSubject ? allTutors.filter(tutor => {
                const tutorSubjects = tutor.subject?.toLowerCase().split(',').map(s => s.trim()) || [];
                return tutorSubjects.some(s => s.includes(currentSubject) || currentSubject.includes(s));
            }) : allTutors;
            if (!searchTerm) { displayTutors(baseArray); return; }
            const filtered = baseArray.filter(tutor => {
                const subjectMatch = tutor.subject && tutor.subject.toLowerCase().includes(searchTerm);
                const areaMatch = tutor.area && tutor.area.toLowerCase().includes(searchTerm);
                const nameMatch = tutor.name && tutor.name.toLowerCase().includes(searchTerm);
                return subjectMatch || areaMatch || nameMatch;
            });
            displayTutors(filtered);
        };

        window.openContactModal = async function (tutorId, tutorFullName, tutorImg) {
            selectedTutor = { id: tutorId, name: tutorFullName, image: tutorImg };
            const contactModal = document.getElementById("contactModal");
            const contactTutorInfo = document.getElementById("contactTutorInfo");
            const loginPrompt = document.getElementById("loginPrompt");
            const contactForm = document.getElementById("contactForm");
            const selfWarning = document.getElementById("selfWarning");

            loginPrompt.style.display = "none";
            contactForm.style.display = "none";
            selfWarning.style.display = "none";

            contactTutorInfo.innerHTML = `
            <img src="${tutorImg}" alt="${escapeHtml(tutorFullName)}">
            <div><h4><i class="fas fa-chalkboard-teacher"></i> ${escapeHtml(tutorFullName)}</h4><p>You are contacting this tutor</p></div>
        `;

            if (!isLoggedIn) {
                loginPrompt.style.display = "block";
                contactModal.style.display = "flex";
                return;
            }

            if (userType === 'tutor') {
                if (!currentTutorId) await fetchCurrentTutorId();
                if (currentTutorId && currentTutorId === tutorId) {
                    selfWarning.style.display = "block";
                    contactModal.style.display = "flex";
                    return;
                }
            }

            contactForm.style.display = "block";
            if (userName) document.getElementById("studentName").value = userName;
            const userPhone = localStorage.getItem("userPhone") || "";
            document.getElementById("contactPhone").value = userPhone;
            document.getElementById("area").value = "";
            document.getElementById("details").value = "";
            contactModal.style.display = "flex";
        };

        window.closeContactModal = function () {
            document.getElementById("contactModal").style.display = "none";
            const form = document.getElementById("contactForm");
            if (form) form.reset();
        };

        document.getElementById("contactForm")?.addEventListener("submit", async function (e) {
            e.preventDefault();
            if (!selectedTutor || !userDocId) {
                alert("Session error. Please login again.");
                return;
            }
            const requestData = {
                tutorId: selectedTutor.id,
                tutorName: selectedTutor.name,
                studentName: document.getElementById("studentName").value,
                area: document.getElementById("area").value,
                phone: document.getElementById("contactPhone").value,
                details: document.getElementById("details").value,
                status: "pending",
                userId: userDocId,
                userType: localStorage.getItem("userType") || "user",
                userName: localStorage.getItem("userName") || "Unknown",
                createdAt: serverTimestamp()
            };
            try {
                const submitBtn = e.target.querySelector("button[type='submit']");
                const originalText = submitBtn.innerHTML;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
                submitBtn.disabled = true;
                await addDoc(collection(db, "teacherContactRequests"), requestData);
                alert("✅ Request sent! Admin will contact you soon.");
                closeContactModal();
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            } catch (error) {
                console.error(error);
                alert("❌ Failed to send request. Try again.");
                const submitBtn = e.target.querySelector("button[type='submit']");
                submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Submit Request';
                submitBtn.disabled = false;
            }
        });

        window.onload = loadTutors;
        window.onclick = (event) => {
            const tutorModal = document.getElementById("tutorDetailsModal");
            const contactModal = document.getElementById("contactModal");
            if (event.target === tutorModal) tutorModal.style.display = "none";
            if (event.target === contactModal) contactModal.style.display = "none";
        };
    </script>
</body>

</html>
