<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuition Applications - Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(180deg, #fde7f3 0%, #fff0f8 100%);
            min-height: 100vh;
        }

        nav {
            height: 75px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            top: 0;
            left: 0;
            width: 100%;
            padding: 0 40px;
            z-index: 10;
            background: linear-gradient(90deg,
                    rgba(228, 191, 208, 0.95),
                    rgba(211, 112, 168, 0.95),
                    rgba(155, 38, 91, 0.95));
            backdrop-filter: blur(6px);
            box-shadow: 0 4px 20px rgba(193, 53, 132, 0.3);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 7px;
            position: relative;
            margin-left: -25px;
        }

        .logo-img {
            width: 150px;
            height: auto;
        }

        .admin-info {
            display: flex;
            align-items: center;
            gap: 20px;
            color: white;
        }

        .admin-badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .admin-badge i {
            margin-right: 8px;
            color: #ffd700;
        }

        .back-btn {
            background: #ffffff;
            color: #c13584;
            border: none;
            padding: 8px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .back-btn:hover {
            background: #fde7f3;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(193, 53, 132, 0.4);
        }

        .logout-btn {
            background: #ffffff;
            color: #c13584;
            border: none;
            padding: 8px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .logout-btn:hover {
            background: #fde7f3;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(193, 53, 132, 0.4);
        }

        .container {
            padding: 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            color: #8e164d;
        }

        .page-header h1 {
            font-size: 28px;
        }

        .page-header h1 i {
            color: #c13584;
            margin-right: 10px;
        }

        .filter-section {
            display: flex;
            gap: 15px;
        }

        .filter-select {
            padding: 10px 15px;
            border-radius: 30px;
            border: 1px solid #fad1e4;
            background: white;
            color: #333;
            outline: none;
            font-size: 14px;
        }

        .filter-select:focus {
            border-color: #c13584;
            box-shadow: 0 0 5px rgba(193, 53, 132, 0.2);
        }

        .data-table {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(193, 53, 132, 0.1);
            border: 1px solid #fad1e4;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            color: #333;
        }

        th {
            background: linear-gradient(135deg, #ff5ca8, #c13584);
            color: white;
            padding: 15px;
            text-align: left;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #fde7f3;
        }

        tr:hover {
            background: #fff0f8;
        }

        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-approved {
            background: #d4edda;
            color: #155724;
        }

        .status-rejected {
            background: #f8d7da;
            color: #721c24;
        }

        .action-btn {
            background: linear-gradient(135deg, #ff5ca8, #c13584);
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
            margin: 0 3px;
            transition: 0.3s;
        }

        .action-btn.approve {
            background: linear-gradient(135deg, #4caf50, #45a049);
        }

        .action-btn.reject {
            background: linear-gradient(135deg, #f44336, #d32f2f);
        }

        .action-btn.delete {
            background: linear-gradient(135deg, #ff9800, #f57c00);
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 3px 8px rgba(193, 53, 132, 0.3);
        }

        .empty-message {
            text-align: center;
            padding: 60px;
            color: #666;
            font-size: 16px;
        }

        .empty-message i {
            font-size: 50px;
            margin-bottom: 20px;
            color: #c13584;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .loading i {
            font-size: 40px;
            color: #c13584;
            margin-bottom: 15px;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            max-width: 600px;
            width: 90%;
            color: #333;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 40px rgba(193, 53, 132, 0.2);
        }

        .modal-content h3 {
            color: #8e164d;
            margin-bottom: 20px;
        }

        .modal-content h3 i {
            color: #c13584;
        }

        .modal-details {
            margin-bottom: 20px;
        }

        .modal-details p {
            margin: 10px 0;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 10px;
            border: 1px solid #fde7f3;
        }

        .modal-details strong {
            color: #c13584;
            display: inline-block;
            width: 120px;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
        }

        .modal-buttons button {
            padding: 10px 25px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .close-modal {
            background: #eee;
            color: #333;
        }

        .close-modal:hover {
            background: #ddd;
        }

        @media (max-width: 768px) {
            nav {
                padding: 0 20px;
            }
            
            .logo-img {
                width: 120px;
            }
            
            .admin-badge {
                display: none;
            }
            
            .container {
                padding: 20px;
            }
            
            table {
                font-size: 14px;
            }
            
            td, th {
                padding: 10px;
            }
            
            .filter-section {
                flex-direction: column;
            }
            
            .modal-details strong {
                width: 100px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo-container">
            <img src="logo.png" alt="TutorPoint" class="logo-img">
        </div>
        <div class="admin-info">
            <span class="admin-badge"><i class="fas fa-user-shield"></i> Admin</span>
            <a href="admin_home.html" class="back-btn"><i class="fas fa-arrow-left"></i> Dashboard</a>
            <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1><i class="fas fa-file-signature"></i> Tuition Applications</h1>
            <div class="filter-section">
                <select class="filter-select" id="statusFilter" onchange="filterApplications()">
                    <option value="all">All Status</option>
                    <option value="pending">Pending</option>
                    <option value="approved">Approved</option>
                    <option value="rejected">Rejected</option>
                </select>
            </div>
        </div>

        <div class="data-table" id="applicationsTable">
            <div class="loading">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Loading applications...</p>
            </div>
        </div>
    </div>

    <!-- Details Modal -->
    <div class="modal" id="detailsModal">
        <div class="modal-content">
            <h3><i class="fas fa-info-circle"></i> Application Details</h3>
            <div class="modal-details" id="modalDetails"></div>
            <div class="modal-buttons">
                <button class="close-modal" onclick="closeModal()">Close</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy, doc, getDoc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAkUHxzVA6SxcTeheoytoWUAiuTKADWBQw",
            authDomain: "medialert-a04d5.firebaseapp.com",
            projectId: "medialert-a04d5",
            storageBucket: "medialert-a04d5.firebasestorage.app",
            messagingSenderId: "267657249954",
            appId: "1:267657249954:web:01165929839cb83e7e03fb"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Check if user is admin
        const userEmail = localStorage.getItem("userEmail");
        const userType = localStorage.getItem("userType");

        if (!userEmail || userEmail !== "tutorpointwebproject@gmail.com" || userType !== "admin") {
            alert("Access denied! Admin only.");
            window.location.href = "login.html";
        }

        let allApplications = [];

        // Load all applications
        async function loadApplications() {
            try {
                const appsRef = collection(db, "applications");
                const q = query(appsRef, orderBy("appliedAt", "desc"));
                const snapshot = await getDocs(q);
                
                allApplications = [];
                snapshot.forEach(doc => {
                    allApplications.push({ id: doc.id, ...doc.data() });
                });

                renderApplications('all');

            } catch (error) {
                console.error("Error loading applications:", error);
                document.getElementById("applicationsTable").innerHTML = '<div class="empty-message">Error loading data.</div>';
            }
        }

        // Render applications based on filter
        window.renderApplications = function(status) {
            const tableContainer = document.getElementById("applicationsTable");
            
            let filtered = allApplications;
            if (status !== 'all') {
                filtered = allApplications.filter(app => app.status === status);
            }
            
            if (filtered.length === 0) {
                tableContainer.innerHTML = `
                    <div class="empty-message">
                        <i class="fas fa-inbox"></i>
                        <p>No applications found.</p>
                    </div>
                `;
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Tutor</th>
                            <th>Post ID</th>
                            <th>Class</th>
                            <th>Location</th>
                            <th>Subjects</th>
                            <th>Salary</th>
                            <th>Date</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            filtered.forEach(app => {
                const date = app.appliedAt ? new Date(app.appliedAt.toDate()).toLocaleDateString() : 'N/A';
                
                html += `
                    <tr>
                        <td>${app.tutorName || 'N/A'}</td>
                        <td>${app.postId || 'N/A'}</td>
                        <td>${app.postDetails?.classNum || 'N/A'}</td>
                        <td>${app.postDetails?.location || 'N/A'}</td>
                        <td>${app.postDetails?.subjects?.join(', ') || 'N/A'}</td>
                        <td>৳ ${app.postDetails?.salary || 'N/A'}</td>
                        <td>${date}</td>
                        <td><span class="status-badge status-${app.status || 'pending'}">${app.status || 'pending'}</span></td>
                        <td>
                            <button class="action-btn" onclick="viewApplication('${app.id}')"><i class="fas fa-eye"></i></button>
                            <button class="action-btn approve" onclick="updateStatus('${app.id}', 'approved')"><i class="fas fa-check"></i></button>
                            <button class="action-btn reject" onclick="updateStatus('${app.id}', 'rejected')"><i class="fas fa-times"></i></button>
                            <button class="action-btn delete" onclick="deleteApplication('${app.id}')"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            tableContainer.innerHTML = html;
        };

        // Filter applications
        window.filterApplications = function() {
            const status = document.getElementById('statusFilter').value;
            renderApplications(status);
        };

        // View application details
        window.viewApplication = async function(appId) {
            try {
                const appRef = doc(db, "applications", appId);
                const appSnap = await getDoc(appRef);
                
                if (appSnap.exists()) {
                    const data = appSnap.data();
                    const date = data.appliedAt ? new Date(data.appliedAt.toDate()).toLocaleString() : 'N/A';
                    
                    const detailsHtml = `
                        <p><strong>Tutor:</strong> ${data.tutorName || 'N/A'}</p>
                        <p><strong>Tutor Email:</strong> ${data.tutorEmail || 'N/A'}</p>
                        <p><strong>Post ID:</strong> ${data.postId || 'N/A'}</p>
                        <p><strong>Class:</strong> ${data.postDetails?.classNum || 'N/A'}</p>
                        <p><strong>Medium:</strong> ${data.postDetails?.medium || 'N/A'}</p>
                        <p><strong>Location:</strong> ${data.postDetails?.location || 'N/A'}</p>
                        <p><strong>Subjects:</strong> ${data.postDetails?.subjects?.join(', ') || 'N/A'}</p>
                        <p><strong>Salary:</strong> ৳ ${data.postDetails?.salary || 'N/A'}</p>
                        <p><strong>Applied:</strong> ${date}</p>
                        <p><strong>Status:</strong> <span class="status-badge status-${data.status || 'pending'}">${data.status || 'pending'}</span></p>
                    `;
                    
                    document.getElementById('modalDetails').innerHTML = detailsHtml;
                    document.getElementById('detailsModal').style.display = 'flex';
                }
            } catch (error) {
                console.error("Error loading application:", error);
                alert("Error loading details.");
            }
        };

        // Update status
        window.updateStatus = async function(appId, status) {
            try {
                await updateDoc(doc(db, "applications", appId), {
                    status: status,
                    updatedAt: serverTimestamp()
                });
                
                alert(`✅ Application marked as ${status}!`);
                loadApplications(); // Reload data
                
            } catch (error) {
                console.error("Error updating status:", error);
                alert("❌ Error updating status.");
            }
        };

        // Delete application
        window.deleteApplication = async function(appId) {
            if (confirm("Are you sure you want to delete this application?")) {
                try {
                    await deleteDoc(doc(db, "applications", appId));
                    alert("✅ Application deleted!");
                    loadApplications(); // Reload data
                } catch (error) {
                    console.error("Error deleting application:", error);
                    alert("❌ Error deleting application.");
                }
            }
        };

        // Close modal
        window.closeModal = function() {
            document.getElementById('detailsModal').style.display = 'none';
        };

        // Initialize
        loadApplications();

    </script>

    <script>
        // Non-module functions
        window.logout = function() {
            localStorage.clear();
            window.location.href = "login.html";
        };

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('detailsModal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        };
    </script>
</body>

</html>
