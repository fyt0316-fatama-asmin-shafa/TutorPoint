<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Tuition Posts - Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(180deg, #fde7f3 0%, #fff0f8 100%);
            min-height: 100vh;
        }

        nav {
            height: 75px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            background: linear-gradient(90deg, rgba(228, 191, 208, 0.95), rgba(211, 112, 168, 0.95), rgba(155, 38, 91, 0.95));
            backdrop-filter: blur(6px);
        }

        .logo-img {
            width: 150px;
        }

        .admin-info {
            display: flex;
            align-items: center;
            gap: 20px;
            color: white;
        }

        .admin-badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 30px;
        }

        .back-btn,
        .logout-btn,
        .refresh-btn {
            background: white;
            color: #c13584;
            border: none;
            padding: 8px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            padding: 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            color: #8e164d;
            flex-wrap: wrap;
            gap: 15px;
        }

        .page-header h1 {
            font-size: 28px;
        }

        .create-post-btn {
            background: linear-gradient(135deg, #ff5ca8, #c13584);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
        }

        .filter-section {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-box,
        .filter-select {
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid #fad1e4;
            background: white;
        }

        .search-box {
            flex: 1;
        }

        .posts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .post-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            transition: 0.3s;
            border: 1px solid #fad1e4;
            box-shadow: 0 10px 20px rgba(193, 53, 132, 0.1);
        }

        .post-card:hover {
            transform: translateY(-5px);
            border-bottom: 3px solid #c13584;
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #fde7f3;
        }

        .post-id {
            background: linear-gradient(135deg, #ff5ca8, #c13584);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
        }

        .post-date {
            font-size: 12px;
            color: #666;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .detail-label {
            color: #666;
            font-weight: 500;
        }

        .detail-value {
            background: #f0f5fb;
            padding: 3px 10px;
            border-radius: 20px;
        }

        .subjects-list {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 5px;
        }

        .subject-tag {
            background: #e3f0ec;
            color: #1e7e66;
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 12px;
        }

        .salary {
            background: #e3f0ec;
            color: #1e7e66;
            padding: 5px 15px;
            border-radius: 25px;
            display: inline-block;
            margin-top: 10px;
        }

        .post-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .action-btn {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .view-btn {
            background: linear-gradient(135deg, #6c5ce7, #a363d9);
            color: white;
        }

        .delete-btn {
            background: linear-gradient(135deg, #ff5ca8, #c13584);
            color: white;
        }

        .empty-message {
            grid-column: 1/-1;
            text-align: center;
            padding: 60px;
            color: #666;
        }

        .loading {
            grid-column: 1/-1;
            text-align: center;
            padding: 40px;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
        }

        .modal-content h3 {
            color: #8e164d;
            margin-bottom: 20px;
        }

        .warning-text {
            background: #fde7f3;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            margin: 15px 0;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .confirm-delete {
            background: linear-gradient(135deg, #ff5ca8, #c13584);
            color: white;
        }

        .close-modal {
            background: #eee;
        }

        @media (max-width:768px) {
            .container {
                padding: 20px;
            }

            .posts-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <nav>
        <img src="logo.png" alt="TutorPoint" class="logo-img">
        <div class="admin-info">
            <span class="admin-badge"><i class="fas fa-user-shield"></i> Admin</span>
            <a href="admin_home.html" class="back-btn"><i class="fas fa-arrow-left"></i> Dashboard</a>
            <button class="refresh-btn" onclick="location.reload()"><i class="fas fa-sync-alt"></i> Refresh</button>
            <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </nav>
    <div class="container">
        <div class="page-header">
            <h1><i class="fas fa-bullhorn"></i> Manage Tuition Posts</h1>
            <button class="create-post-btn" onclick="window.location.href='admin_home.html#postForm'"><i
                    class="fas fa-plus-circle"></i> Create New Post</button>
        </div>
        <div class="filter-section">
            <input type="text" class="search-box" id="searchInput" placeholder="🔍 Search by ID, Class, Location..."
                onkeyup="filterPosts()">
            <select class="filter-select" id="sortFilter" onchange="filterPosts()">
                <option value="newest">Newest First</option>
                <option value="oldest">Oldest First</option>
                <option value="salary-high">Salary: High to Low</option>
                <option value="salary-low">Salary: Low to High</option>
            </select>
        </div>
        <div class="posts-grid" id="postsGrid">
            <div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading posts...</div>
        </div>
    </div>

    <!-- View Modal -->
    <div class="modal" id="viewModal">
        <div class="modal-content">
            <h3><i class="fas fa-info-circle"></i> Post Details</h3>
            <div id="viewModalDetails"></div>
            <div class="modal-buttons"><button class="close-modal" onclick="closeViewModal()">Close</button></div>
        </div>
    </div>
    <!-- Delete Modal -->
    <div class="modal" id="deleteModal">
        <div class="modal-content">
            <h3><i class="fas fa-exclamation-triangle"></i> Confirm Delete</h3>
            <p style="margin:15px 0; text-align:center;">Are you sure you want to delete this post?</p>
            <p style="text-align:center; font-weight:bold;" id="deletePostId"></p>
            <div class="warning-text"><i class="fas fa-exclamation-circle"></i> All applications for this post will also
                be deleted.</div>
            <div class="modal-buttons"><button class="close-modal" onclick="closeDeleteModal()">Cancel</button><button
                    class="confirm-delete" id="confirmDeleteBtn">Delete Permanently</button></div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, orderBy, doc, deleteDoc, getDocs, where, writeBatch, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    
    const firebaseConfig = {
        apiKey: "AIzaSyAkUHxzVA6SxcTeheoytoWUAiuTKADWBQw",
        authDomain: "medialert-a04d5.firebaseapp.com",
        projectId: "medialert-a04d5",
        storageBucket: "medialert-a04d5.firebasestorage.app",
        messagingSenderId: "267657249954",
        appId: "1:267657249954:web:01165929839cb83e7e03fb"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    // Admin check (localStorage based)
    const userEmail = localStorage.getItem("userEmail");
    const userType = localStorage.getItem("userType");
    if (!userEmail || userEmail !== "tutorpointwebproject@gmail.com" || userType !== "admin") {
        alert("Access denied! Admin only.");
        window.location.href = "login.html";
    }
    
    let allPosts = [];
    let currentDeleteId = null;
    
    // Real-time listener
    const q = query(collection(db, "tuitionPosts"), orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
        allPosts = [];
        snapshot.forEach(doc => allPosts.push({ id: doc.id, ...doc.data() }));
        renderPosts();
    }, (err) => { 
        console.error("Snapshot error:", err);
        document.getElementById("postsGrid").innerHTML = `<div class="empty-message">Error loading posts: ${err.message}</div>`;
    });
    
    function renderPosts() {
        const grid = document.getElementById("postsGrid");
        const searchTerm = document.getElementById("searchInput")?.value.toLowerCase() || "";
        const sortValue = document.getElementById("sortFilter")?.value || "newest";
        let filtered = allPosts.filter(p => `${p.id} ${p.classNum} ${p.location} ${p.subjects?.join(' ')}`.toLowerCase().includes(searchTerm));
        filtered.sort((a, b) => {
            const da = a.createdAt?.toDate?.() || new Date(a.createdAt || 0);
            const db = b.createdAt?.toDate?.() || new Date(b.createdAt || 0);
            if (sortValue === 'newest') return db - da;
            if (sortValue === 'oldest') return da - db;
            if (sortValue === 'salary-high') return (b.salary || 0) - (a.salary || 0);
            if (sortValue === 'salary-low') return (a.salary || 0) - (b.salary || 0);
            return db - da;
        });
        if (filtered.length === 0) {
            grid.innerHTML = `<div class="empty-message"><i class="fas fa-inbox"></i> No tuition posts. Create one!</div>`;
            return;
        }
        grid.innerHTML = filtered.map(p => {
            const date = p.createdAt?.toDate?.() ? new Date(p.createdAt.toDate()).toLocaleDateString() : 'N/A';
            const salary = p.salary || (p.subjects ? p.subjects.length * 1000 : 0);
            return `<div class="post-card">
                <div class="post-header"><span class="post-id">${p.id}</span><span class="post-date"><i class="far fa-calendar-alt"></i> ${date}</span></div>
                <div class="detail-row"><span class="detail-label">Class:</span><span class="detail-value">${p.classNum}</span></div>
                <div class="detail-row"><span class="detail-label">Medium:</span><span class="detail-value">${p.medium}</span></div>
                <div class="detail-row"><span class="detail-label">Location:</span><span class="detail-value">${p.location}</span></div>
                <div class="detail-row"><span class="detail-label">Subjects:</span><div class="subjects-list">${(p.subjects || []).map(s => `<span class="subject-tag">${s}</span>`).join('')}</div></div>
                <div class="salary">৳ ${salary}</div>
                ${p.details ? `<div style="margin-top:10px; font-size:13px;"><i class="fas fa-info-circle"></i> ${p.details}</div>` : ''}
                <div class="post-actions"><button class="action-btn view-btn" onclick="viewPost('${p.id}')">View</button><button class="action-btn delete-btn" onclick="confirmDelete('${p.id}')">Delete</button></div>
            </div>`;
        }).join('');
    }
    
    window.filterPosts = () => renderPosts();
    
    window.viewPost = async (id) => {
        const p = allPosts.find(x => x.id === id);
        if (p) {
            const salary = p.salary || (p.subjects ? p.subjects.length * 1000 : 0);
            document.getElementById("viewModalDetails").innerHTML = `<p><strong>ID:</strong> ${p.id}</p><p><strong>Class:</strong> ${p.classNum}</p><p><strong>Medium:</strong> ${p.medium}</p><p><strong>Location:</strong> ${p.location}</p><p><strong>Subjects:</strong> ${p.subjects?.join(', ')}</p><p><strong>Salary:</strong> ৳ ${salary}</p>${p.details ? `<p><strong>Details:</strong> ${p.details}</p>` : ''}`;
            document.getElementById('viewModal').classList.add('active');
        }
    };
    
    window.confirmDelete = (id) => {
        currentDeleteId = id;
        document.getElementById('deletePostId').innerHTML = `Post ID: ${id}`;
        document.getElementById('deleteModal').classList.add('active');
    };
    
    // ✅ ডিলিট ফাংশন উন্নত
    document.getElementById('confirmDeleteBtn').onclick = async () => {
        if (!currentDeleteId) return;
        const btn = document.getElementById('confirmDeleteBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Deleting...';
        try {
            // Related applications খুঁজে বের করুন
            const appsQuery = query(collection(db, "applications"), where("postId", "==", currentDeleteId));
            const appsSnap = await getDocs(appsQuery);
            console.log(`Found ${appsSnap.size} applications for post ${currentDeleteId}`);
            
            const batch = writeBatch(db);
            appsSnap.forEach(d => batch.delete(d.ref));
            const postRef = doc(db, "tuitionPosts", currentDeleteId);
            batch.delete(postRef);
            await batch.commit();
            
            alert(`✅ Post and ${appsSnap.size} related application(s) deleted successfully.`);
            closeDeleteModal();
            
            // onSnapshot automatically updates the UI
        } catch (error) {
            console.error("Delete error:", error);
            alert("❌ Error deleting: " + error.message);
        } finally {
            btn.disabled = false;
            btn.innerHTML = 'Delete Permanently';
        }
    };
    
    window.closeViewModal = () => document.getElementById('viewModal').classList.remove('active');
    window.closeDeleteModal = () => {
        document.getElementById('deleteModal').classList.remove('active');
        currentDeleteId = null;
    };
    window.logout = () => {
        localStorage.clear();
        window.location.href = "login.html";
    };
    window.onclick = (e) => {
        if (e.target === document.getElementById('viewModal')) closeViewModal();
        if (e.target === document.getElementById('deleteModal')) closeDeleteModal();
    };
</script>
</body>

</html>
